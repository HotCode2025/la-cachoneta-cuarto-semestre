<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activar Bomba</title>
    <link rel="stylesheet" href="/css/style.css" />

  <body>
    <div class="grid"></div>

    <div class="warning"></div>

    <div class="base">
      <button id="activate">
        <span></span>
      </button>
    </div>

    <div class="box opened" id="cover">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <span></span><span></span>
    </div>

    <div class="hinges"></div>

    <div class="text">Agustin-&thinsp;Gonzalez</div>

    <div id="panel">
      <div id="msg">DEVICE SELF-DESTRUCTION</div>
      <div id="time">9</div>
      <div id="abort">ABORT</div>
      <div id="detonate">DETONATE</div>
    </div>
    <div id="turn-off"></div>
    <div id="closing"></div>

    <div id="restart"><button id="reload"></button></div>

    <div id="mute"></div>

    <audio id="alarm" src="/sound/alarm.mp3"></audio>
    <audio id="alarm2" src="/sound/explosion.mp3"></audio>
    <script src="/prueba.js"></script>
